<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>حسابي | متجر لمسة LAMSA</title>
  
  <!-- Prevent Indexing -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Favicon -->
  <link rel="icon" href="/assets/logo.png" type="image/png">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#5C0E14">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at center top, #4A0D11 0%, #200407 55%, #100204 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #FFFFFF;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
      margin: 0;
    }

    /* Ambient Gold Light Behind Card */
    body::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 90vw);
      height: min(600px, 90vw);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .account-container {
      width: 100%;
      max-width: 540px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .account-card {
      background: rgba(30, 6, 9, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 40px) clamp(18px, 4vw, 32px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.1);
      text-align: center;
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    .account-logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.25) 0%, rgba(92, 14, 20, 0.8) 100%);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
      padding: 3px;
    }

    .account-logo-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .account-title {
      font-size: clamp(1.4rem, 3.5vw, 1.8rem);
      color: var(--gold);
      font-family: var(--font-title);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .account-sub {
      font-size: clamp(0.82rem, 2.5vw, 0.92rem);
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .user-info-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: right;
    }

    .user-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-info-row:last-child {
      border-bottom: none;
    }

    .user-info-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }

    .user-info-value {
      font-size: 0.95rem;
      color: var(--gold-light);
      font-weight: 700;
    }

    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
      margin: 30px 0;
    }

    .section-title {
      font-size: 1.1rem;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 16px;
      text-align: right;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .account-form {
      text-align: right;
    }

    .account-form .input-group {
      margin-bottom: 14px;
    }

    .account-form .input-group label {
      display: block;
      color: var(--gold-light);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: right;
    }

    .account-form .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 10px 14px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    .account-form .form-input:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    .account-form .form-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: rgba(0, 0, 0, 0.2);
    }

    .btn-logout {
      background: linear-gradient(135deg, #8B1520 0%, #5C0E14 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 100, 100, 0.4);
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: linear-gradient(135deg, #A01828 0%, #6B1118 100%);
      border-color: rgba(255, 100, 100, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 21, 32, 0.4);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 16px;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: var(--gold);
      transform: translateX(4px);
    }

    .account-footer {
      text-align: center;
      padding: 16px 10px 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <div class="account-container">
    <div class="account-card">
      
      <!-- Logo -->
      <div class="account-logo-wrap">
        <img src="assets/logo.png" alt="LAMSA Logo">
      </div>

      <h1 class="account-title">حسابي</h1>
      <p class="account-sub">إدارة بياناتك الشخصية وكلمة المرور</p>

      <!-- Current User Info -->
      <div class="user-info-box" id="userInfoBox">
        <div class="user-info-row">
          <span class="user-info-label">الاسم:</span>
          <span class="user-info-value" id="displayName">...</span>
        </div>
        <div class="user-info-row">
          <span class="user-info-label">البريد الإلكتروني:</span>
          <span class="user-info-value" id="displayEmail">...</span>
        </div>
      </div>

      <!-- Section 1: Update Name -->
      <div class="section-divider"></div>
      
      <h3 class="section-title">✏️ تغيير الاسم</h3>
      <form class="account-form" id="updateNameForm" onsubmit="handleUpdateName(event)">
        <div class="input-group">
          <label>الاسم الجديد *</label>
          <input type="text" class="form-input" id="newName" required placeholder="أدخل اسمك الجديد" minlength="3">
        </div>
        <button type="submit" class="btn btn-gold btn-full btn-lg" id="updateNameBtn">
          حفظ الاسم الجديد ✓
        </button>
      </form>

      <!-- Section 2: Change Password (for regular users) OR Set Password (for Google users) -->
      <div class="section-divider"></div>
      
      <div id="changePasswordSection">
        <h3 class="section-title">🔒 تغيير كلمة المرور</h3>
        <form class="account-form" id="changePasswordForm" onsubmit="handleChangePassword(event)">
          <div class="input-group">
            <label>كلمة المرور الحالية *</label>
            <input type="password" class="form-input" id="oldPassword" required placeholder="أدخل كلمة المرور الحالية" minlength="6">
          </div>
          <div class="input-group">
            <label>كلمة المرور الجديدة *</label>
            <input type="password" class="form-input" id="newPassword" required placeholder="أدخل كلمة المرور الجديدة" minlength="6">
          </div>
          <div class="input-group">
            <label>تأكيد كلمة المرور الجديدة *</label>
            <input type="password" class="form-input" id="confirmPassword" required placeholder="أعد إدخال كلمة المرور الجديدة" minlength="6">
          </div>
          <button type="submit" class="btn btn-gold btn-full btn-lg" id="changePasswordBtn">
            تغيير كلمة المرور 🔐
          </button>
        </form>
      </div>

      <div id="setPasswordSection" style="display: none;">
        <h3 class="section-title">🔐 إنشاء كلمة مرور</h3>
        <div style="background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: right;">
          <p style="font-size: 0.9rem; color: var(--gold-light); margin: 0; line-height: 1.6;">
            ℹ️ حسابك مسجل عبر Google، يمكنك إنشاء كلمة مرور لتسجيل الدخول بها لاحقاً بدون Google
          </p>
        </div>
        <form class="account-form" id="setPasswordForm" onsubmit="handleSetPassword(event)">
          <div class="input-group">
            <label>كلمة المرور الجديدة *</label>
            <input type="password" class="form-input" id="setNewPassword" required placeholder="أدخل كلمة المرور الجديدة" minlength="6">
          </div>
          <div class="input-group">
            <label>تأكيد كلمة المرور *</label>
            <input type="password" class="form-input" id="setConfirmPassword" required placeholder="أعد إدخال كلمة المرور" minlength="6">
          </div>
          <button type="submit" class="btn btn-gold btn-full btn-lg" id="setPasswordBtn">
            حفظ كلمة المرور ✓
          </button>
        </form>
      </div>

      <!-- Logout Button -->
      <div class="section-divider"></div>
      <button class="btn btn-logout btn-full btn-lg" onclick="handleLogout()">
        تسجيل الخروج 🚪
      </button>

      <!-- Back to Shop -->
      <div style="text-align: center;">
        <a href="/shop" class="back-link">← العودة للمتجر</a>
      </div>

    </div>
  </div>

  <div class="account-footer">
    © 2026 متجر لمسة (LAMSA) — جميع الحقوق محفوظة
  </div>

  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    // Check authentication on page load
    (async function checkAuth() {
      const token = localStorage.getItem('lamsa_token');
      
      if (!token) {
        // No token - redirect to auth
        sessionStorage.setItem('lamsa_auth_redirect', window.location.pathname);
        window.location.href = 'auth.html';
        return;
      }

      try {
        // Fetch current user data
        const data = await LAMSA_API.getMe();
        const user = data.data;
        
        // Display user info
        document.getElementById('displayName').textContent = user.name || 'غير محدد';
        document.getElementById('displayEmail').textContent = user.email || 'غير محدد';
        document.getElementById('newName').placeholder = user.name || 'أدخل اسمك الجديد';
        
        // Show appropriate password section based on user type
        if (user.isGoogleUser) {
          // Google user - show set password section
          document.getElementById('changePasswordSection').style.display = 'none';
          document.getElementById('setPasswordSection').style.display = 'block';
        } else {
          // Regular user - show change password section
          document.getElementById('changePasswordSection').style.display = 'block';
          document.getElementById('setPasswordSection').style.display = 'none';
        }
        
      } catch (error) {
        console.error('[Account] Failed to load user:', error);
        
        // Token invalid or expired - redirect to auth
        localStorage.removeItem('lamsa_token');
        localStorage.removeItem('lamsa_user');
        sessionStorage.setItem('lamsa_auth_redirect', window.location.pathname);
        window.location.href = 'auth.html';
      }
    })();

    // Update Name Handler
    async function handleUpdateName(e) {
      e.preventDefault();
      const newName = document.getElementById('newName').value.trim();
      const submitBtn = document.getElementById('updateNameBtn');
      
      if (newName.length < 3) {
        showToast('⚠️ الاسم يجب أن يكون 3 أحرف على الأقل');
        return;
      }

      // Disable button during request
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ جاري الحفظ...';

      try {
        const data = await LAMSA_API.updateName({ name: newName });
        
        // Update display
        document.getElementById('displayName').textContent = newName;
        
        // Update localStorage user
        const storedUser = JSON.parse(localStorage.getItem('lamsa_user') || '{}');
        storedUser.name = newName;
        localStorage.setItem('lamsa_user', JSON.stringify(storedUser));
        
        showToast(`✓ ${data.message || 'تم تحديث الاسم بنجاح'}`);
        
        // Clear input
        document.getElementById('newName').value = '';
        
      } catch (error) {
        console.error('[Account] Update name failed:', error);
        showToast('⚠️ ' + (error.message || 'فشل تحديث الاسم'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ الاسم الجديد ✓';
      }
    }

    // Change Password Handler (for regular users)
    async function handleChangePassword(e) {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('changePasswordBtn');
      
      // Validation
      if (newPassword.length < 6) {
        showToast('⚠️ كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل');
        return;
      }

      if (newPassword !== confirmPassword) {
        showToast('⚠️ كلمة المرور الجديدة وتأكيدها غير متطابقين');
        return;
      }

      if (oldPassword === newPassword) {
        showToast('⚠️ كلمة المرور الجديدة يجب أن تختلف عن القديمة');
        return;
      }

      // Disable button during request
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ جاري التغيير...';

      try {
        const data = await LAMSA_API.changePassword({ 
          oldPassword, 
          newPassword 
        });
        
        showToast(`✓ ${data.message || 'تم تغيير كلمة المرور بنجاح'}`);
        
        // Clear form
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        
      } catch (error) {
        console.error('[Account] Change password failed:', error);
        showToast('⚠️ ' + (error.message || 'فشل تغيير كلمة المرور'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'تغيير كلمة المرور 🔐';
      }
    }

    // Set Password Handler (for Google users)
    async function handleSetPassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById('setNewPassword').value;
      const confirmPassword = document.getElementById('setConfirmPassword').value;
      const submitBtn = document.getElementById('setPasswordBtn');
      
      // Validation
      if (newPassword.length < 6) {
        showToast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل');
        return;
      }

      if (newPassword !== confirmPassword) {
        showToast('⚠️ كلمة المرور وتأكيدها غير متطابقين');
        return;
      }

      // Disable button during request
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ جاري الحفظ...';

      try {
        const data = await LAMSA_API.setPassword({ 
          newPassword 
        });
        
        showToast(`✓ ${data.message || 'تم إنشاء كلمة المرور بنجاح'}`);
        
        // Clear form
        document.getElementById('setNewPassword').value = '';
        document.getElementById('setConfirmPassword').value = '';
        
        // Switch to change password section after successful set
        setTimeout(() => {
          document.getElementById('setPasswordSection').style.display = 'none';
          document.getElementById('changePasswordSection').style.display = 'block';
          showToast('💡 يمكنك الآن تغيير كلمة المرور من القسم أعلاه');
        }, 2000);
        
      } catch (error) {
        console.error('[Account] Set password failed:', error);
        showToast('⚠️ ' + (error.message || 'فشل إنشاء كلمة المرور'));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'حفظ كلمة المرور ✓';
      }
    }

    // Logout Handler
    function handleLogout() {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        // Clear all auth data
        localStorage.removeItem('lamsa_token');
        localStorage.removeItem('lamsa_user');
        sessionStorage.removeItem('lamsa_auth_redirect');
        
        showToast('✓ تم تسجيل الخروج بنجاح');
        
        // Redirect to auth
        setTimeout(() => {
          window.location.href = 'auth.html';
        }, 500);
      }
    }
  </script>
</body>
</html>
