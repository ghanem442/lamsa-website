<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>تسجيل الدخول | متجر لمسة LAMSA</title>
  
  <!-- Prevent Indexing -->
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Favicon -->
  <link rel="icon" href="/assets/logo.png" type="image/png">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#5C0E14">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at center top, #4A0D11 0%, #200407 55%, #100204 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #FFFFFF;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
      margin: 0;
    }

    /* Ambient Gold Light Behind Card */
    body::before {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 90vw);
      height: min(600px, 90vw);
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .auth-card {
      background: rgba(30, 6, 9, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 40px) clamp(18px, 4vw, 32px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.1);
      text-align: center;
      position: relative;
      width: 100%;
    }

    .auth-logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.25) 0%, rgba(92, 14, 20, 0.8) 100%);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
      padding: 3px;
    }

    .auth-logo-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .auth-title {
      font-size: clamp(1.4rem, 3.5vw, 1.8rem);
      color: var(--gold);
      font-family: var(--font-title);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .auth-sub {
      font-size: clamp(0.82rem, 2.5vw, 0.92rem);
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    /* Google Button (Primary Action) */
    .btn-google-luxury {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #FFFFFF;
      color: #2D0609;
      font-family: inherit;
      font-weight: 700;
      font-size: clamp(0.88rem, 2.5vw, 0.96rem);
      padding: 12px 18px;
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--gold);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .btn-google-luxury:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
      background: #FAF7F0;
    }

    .btn-google-luxury svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.82rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
    }

    /* Tabs (Login / Register) */
    .auth-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--radius-xl);
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-tab {
      flex: 1;
      padding: 9px 12px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 700;
      font-size: clamp(0.82rem, 2.5vw, 0.88rem);
      border-radius: var(--radius-xl);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: var(--gold-metallic);
      color: #2D0609;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .auth-form {
      text-align: right;
    }

    .auth-form .input-group {
      margin-bottom: 14px;
    }

    .auth-form .input-group label {
      display: block;
      color: var(--gold-light);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .auth-form .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 10px 14px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.25s ease;
    }

    .auth-form .form-input:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    /* OTP Verification Styles */
    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      direction: ltr;
      margin: 20px 0;
    }

    .otp-box {
      width: 48px;
      height: 54px;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: var(--gold);
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      font-family: monospace;
      transition: all 0.25s ease;
    }

    .otp-box:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
      transform: translateY(-2px);
    }

    .resend-btn {
      background: none;
      border: none;
      color: var(--gold-light);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .resend-btn:hover {
      color: #FFFFFF;
    }

    .auth-footer {
      text-align: center;
      padding: 16px 10px 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Logo -->
      <div class="auth-logo-wrap">
        <img src="assets/logo.png" alt="LAMSA Logo">
      </div>

      <h1 class="auth-title">متجر لمسة (LAMSA)</h1>
      <p class="auth-sub">سجل دخولك لتجربة تسوق فاخرة وحفظ روتينك وخلطاتك العطرية</p>

      <!-- Primary Google Gmail Login Button -->
      <button class="btn-google-luxury" id="googleLoginBtn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>المتابعة عبر حساب Google (Gmail)</span>
      </button>

      <!-- Divider -->
      <div class="auth-divider">أو عبر البريد الإلكتروني</div>

      <!-- Tabs (Login / Signup) -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</button>
        <button class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">حساب جديد</button>
      </div>

      <!-- Form -->
      <form class="auth-form" id="authForm" onsubmit="handleEmailAuth(event)">
        
        <div class="input-group" id="nameGroup" style="display: none;">
          <label>الاسم الكريم *</label>
          <input type="text" class="form-input" id="authName" placeholder="اكتب اسمك">
        </div>

        <div class="input-group">
          <label>البريد الإلكتروني (Gmail) *</label>
          <input type="email" class="form-input" id="authEmail" required placeholder="example@gmail.com">
        </div>

        <div class="input-group">
          <label>كلمة المرور *</label>
          <input type="password" class="form-input" id="authPassword" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-gold btn-full btn-lg mt-8" id="submitAuthBtn">
          تسجيل الدخول للمتجر ←
        </button>
      </form>

      <!-- OTP Verification Screen (For Signup) -->
      <div id="otpSection" style="display: none;">
        <div style="font-size: 2.6rem; margin-bottom: 8px;">📩</div>
        <h2 style="font-size: 1.35rem; color: var(--gold); margin-bottom: 8px;">تأكيد بريدك الإلكتروني</h2>
        <p style="font-size: 0.86rem; color: rgba(255,255,255,0.75); line-height: 1.6;">
          أرسلنا رمز تأكيد سري إلى بريدك:<br>
          <strong id="otpTargetEmail" style="color: var(--gold-light);"></strong>
        </p>
        <p style="font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 10px;">
          💡 لم تجد الرسالة؟ تحقق من مجلد <strong style="color: var(--gold-light);">الرسائل غير المرغوب فيها (Spam)</strong> أو <strong style="color: var(--gold-light);">المهملات</strong>
        </p>

        <div class="otp-inputs">
          <input type="text" class="otp-box" maxlength="1" id="otp1" oninput="moveOtpFocus(this, 'otp2', null)" autofocus>
          <input type="text" class="otp-box" maxlength="1" id="otp2" oninput="moveOtpFocus(this, 'otp3', 'otp1')">
          <input type="text" class="otp-box" maxlength="1" id="otp3" oninput="moveOtpFocus(this, 'otp4', 'otp2')">
          <input type="text" class="otp-box" maxlength="1" id="otp4" oninput="moveOtpFocus(this, null, 'otp3')">
        </div>

        <button type="button" class="btn btn-gold btn-full btn-lg" onclick="verifyOtpCode()">
          تأكيد الرمز والدخول للمتجر ✨
        </button>

        <div>
          <button type="button" class="resend-btn" onclick="resendOtpCode()">لم يصلك الرمز؟ إعادة الإرسال</button>
        </div>
      </div>

    </div>
  </div>

  <div class="auth-footer">
    © 2026 متجر لمسة (LAMSA) — جميع الحقوق محفوظة
  </div>

  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Google Identity Services (loaded dynamically if configured) -->
  <script>
    let currentAuthMode = 'login';
    let googleClientId = null;

    // Load public config and initialize Google Sign-In
    async function initializeAuth() {
      try {
        // Fetch public config to get Google Client ID
        const response = await fetch('/api/config/public');
        const data = await response.json();
        
        if (data.success && data.data.googleClientId) {
          googleClientId = data.data.googleClientId;
          
          // Load Google Identity Services script
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.defer = true;
          script.onload = initializeGoogleSignIn;
          script.onerror = () => {
            console.warn('[Google Auth] Failed to load Google Identity Services');
            hideGoogleButton();
          };
          document.head.appendChild(script);
        } else {
          // Google OAuth not configured - hide button
          hideGoogleButton();
        }
      } catch (error) {
        console.error('[Auth] Failed to load config:', error);
        hideGoogleButton();
      }
    }

    function hideGoogleButton() {
      const googleBtn = document.querySelector('.btn-google-luxury');
      if (googleBtn) {
        googleBtn.style.display = 'none';
      }
      const divider = document.querySelector('.auth-divider');
      if (divider) {
        divider.style.display = 'none';
      }
    }

    function initializeGoogleSignIn() {
      if (!window.google || !googleClientId) {
        hideGoogleButton();
        return;
      }

      try {
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleGoogleCallback,
          auto_select: false
        });
      } catch (error) {
        console.error('[Google Auth] Failed to initialize:', error);
        hideGoogleButton();
      }
    }

    function handleGoogleLogin() {
      if (!window.google || !googleClientId) {
        showToast('⚠️ تسجيل الدخول عبر Google غير متاح حالياً');
        return;
      }

      try {
        // Show Google One Tap or prompt
        google.accounts.id.prompt((notification) => {
          if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
            // If prompt fails, show error
            showToast('⚠️ فشل فتح نافذة Google. يرجى التحقق من إعدادات المتصفح');
          }
        });
      } catch (error) {
        console.error('[Google Auth] Error showing prompt:', error);
        showToast('⚠️ حدث خطأ. يرجى المحاولة مرة أخرى');
      }
    }

    async function handleGoogleCallback(response) {
      if (!response.credential) {
        showToast('⚠️ فشل الحصول على بيانات Google');
        return;
      }

      try {
        // Send ID token to backend
        const data = await LAMSA_API.googleLogin({ credential: response.credential });
        
        // Same handling as email login
        const { user, token } = data.data;
        
        // Store token and user info
        localStorage.setItem('lamsa_token', token);
        localStorage.setItem('lamsa_user', JSON.stringify({
          id: user.id,
          name: user.name,
          email: user.email,
          role: user.role,
          avatar: user.role === 'admin' ? '👑' : '✨',
          loginTime: new Date().toISOString()
        }));

        triggerConfetti();
        showToast(`✓ ${data.message || 'تم تسجيل الدخول بنجاح'}`);
        
        // Redirect based on role
        const returnUrl = sessionStorage.getItem('lamsa_auth_redirect');
        sessionStorage.removeItem('lamsa_auth_redirect');
        
        setTimeout(() => {
          if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = returnUrl || 'index.html';
          }
        }, 800);
        
      } catch (error) {
        console.error('[Google Auth] Login failed:', error);
        showToast('⚠️ ' + (error.message || 'فشل تسجيل الدخول عبر Google'));
      }
    }

    // Initialize auth on page load
    initializeAuth();
    
    // Attach Google login handler after page load
    document.addEventListener('DOMContentLoaded', function() {
      const googleBtn = document.getElementById('googleLoginBtn');
      if (googleBtn) {
        googleBtn.addEventListener('click', handleGoogleLogin);
      }
    });

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
      
      const nameGroup = document.getElementById('nameGroup');
      const submitBtn = document.getElementById('submitAuthBtn');

      if (mode === 'signup') {
        nameGroup.style.display = 'block';
        document.getElementById('authName').required = true;
        submitBtn.textContent = 'إنشاء حساب جديد والدخول ✨';
      } else {
        nameGroup.style.display = 'none';
        document.getElementById('authName').required = false;
        submitBtn.textContent = 'تسجيل الدخول للمتجر ←';
      }
    }

    // Email / Password Handler - Uses Backend API
    let pendingRegistration = null;
    let lastResendTime = 0;
    const RESEND_COOLDOWN = 60000; // 60 seconds

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('submitAuthBtn');
      
      // Disable button during request
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ جاري المعالجة...';

      try {
        let data;
        
        if (currentAuthMode === 'signup') {
          // Register new account (Step 1: Send OTP)
          const name = document.getElementById('authName').value.trim();
          data = await LAMSA_API.register({ name, email, password });
          
          // Check if OTP is required
          if (data.data && data.data.requiresOtp) {
            // Store registration data for OTP verification
            pendingRegistration = { name, email, password };
            
            // Show OTP screen
            showOtpScreen(email);
            showToast(`✓ ${data.message}`);
            return;
          }
        } else {
          // Login
          data = await LAMSA_API.login({ email, password });
        }

        // Direct login success (no OTP required or login mode)
        const { user, token } = data.data;
        
        localStorage.setItem('lamsa_token', token);
        localStorage.setItem('lamsa_user', JSON.stringify({
          id: user.id,
          name: user.name,
          email: user.email,
          role: user.role,
          avatar: user.role === 'admin' ? '👑' : '✨',
          loginTime: new Date().toISOString()
        }));

        triggerConfetti();
        showToast(`✓ ${data.message || 'تم تسجيل الدخول بنجاح'}`);
        
        const returnUrl = sessionStorage.getItem('lamsa_auth_redirect');
        sessionStorage.removeItem('lamsa_auth_redirect');
        
        setTimeout(() => {
          if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = returnUrl || 'index.html';
          }
        }, 800);
        
      } catch (error) {
        console.error('[Auth] Login/Register failed:', error.message || error);
        showToast('⚠️ ' + (error.message || 'حدث خطأ في الاتصال'));
        
        submitBtn.disabled = false;
        submitBtn.textContent = currentAuthMode === 'signup' 
          ? 'إنشاء حساب جديد والدخول ✨' 
          : 'تسجيل الدخول للمتجر ←';
      }
    }

    function showOtpScreen(email) {
      document.getElementById('authForm').style.display = 'none';
      document.querySelector('.auth-tabs').style.display = 'none';
      document.querySelector('.auth-divider').style.display = 'none';
      document.getElementById('googleLoginBtn').style.display = 'none';
      
      const otpSection = document.getElementById('otpSection');
      otpSection.style.display = 'block';
      document.getElementById('otpTargetEmail').textContent = email;
      document.getElementById('otp1').focus();
    }

    function moveOtpFocus(current, nextId, prevId) {
      if (current.value.length === 1 && nextId) {
        document.getElementById(nextId).focus();
      }
    }

    async function verifyOtpCode() {
      if (!pendingRegistration) {
        showToast('⚠️ خطأ: لا توجد بيانات تسجيل معلقة');
        return;
      }

      const otp1 = document.getElementById('otp1').value;
      const otp2 = document.getElementById('otp2').value;
      const otp3 = document.getElementById('otp3').value;
      const otp4 = document.getElementById('otp4').value;
      const otpCode = otp1 + otp2 + otp3 + otp4;

      if (otpCode.length !== 4) {
        showToast('⚠️ يرجى إدخال الرمز كاملاً');
        return;
      }

      try {
        const data = await LAMSA_API.verifyOtp({
          email: pendingRegistration.email,
          otpCode: otpCode,
          name: pendingRegistration.name,
          password: pendingRegistration.password
        });

        const { user, token } = data.data;
        
        localStorage.setItem('lamsa_token', token);
        localStorage.setItem('lamsa_user', JSON.stringify({
          id: user.id,
          name: user.name,
          email: user.email,
          role: user.role,
          avatar: user.role === 'admin' ? '👑' : '✨',
          loginTime: new Date().toISOString()
        }));

        triggerConfetti();
        showToast(`✓ ${data.message}`);
        
        const returnUrl = sessionStorage.getItem('lamsa_auth_redirect');
        sessionStorage.removeItem('lamsa_auth_redirect');
        
        setTimeout(() => {
          window.location.href = returnUrl || 'index.html';
        }, 800);

      } catch (error) {
        console.error('[Auth] OTP verification failed:', error);
        showToast('⚠️ ' + (error.message || 'رمز التحقق غير صحيح'));
        
        // Clear OTP inputs
        document.getElementById('otp1').value = '';
        document.getElementById('otp2').value = '';
        document.getElementById('otp3').value = '';
        document.getElementById('otp4').value = '';
        document.getElementById('otp1').focus();
      }
    }

    async function resendOtpCode() {
      if (!pendingRegistration) {
        showToast('⚠️ خطأ: لا توجد بيانات تسجيل معلقة');
        return;
      }

      const now = Date.now();
      const timeSinceLastResend = now - lastResendTime;
      
      if (timeSinceLastResend < RESEND_COOLDOWN) {
        const remainingSeconds = Math.ceil((RESEND_COOLDOWN - timeSinceLastResend) / 1000);
        showToast(`⏳ يرجى الانتظار ${remainingSeconds} ثانية قبل إعادة الإرسال`);
        return;
      }

      try {
        const data = await LAMSA_API.resendOtp({ email: pendingRegistration.email });
        lastResendTime = now;
        showToast(`✓ ${data.message}`);
        
        // Clear and focus first OTP input
        document.getElementById('otp1').value = '';
        document.getElementById('otp2').value = '';
        document.getElementById('otp3').value = '';
        document.getElementById('otp4').value = '';
        document.getElementById('otp1').focus();
      } catch (error) {
        console.error('[Auth] Resend OTP failed:', error);
        showToast('⚠️ ' + (error.message || 'فشل إعادة إرسال الرمز'));
      }
    }

    // Confetti effect
    function triggerConfetti() {
      if (typeof confetti !== 'undefined') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }
  </script>
</body>
</html>
